  <!-- Three.js module mapping -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    let scene;
    let camera;
    let renderer;
    let controls;
    let phoenix;

    let fireParticles;
    let emberParticles;
    let smokeParticles;

    let fireActive = false;
    let fireStartTime = 0;

    const clock = new THREE.Clock();

    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe9d8bd);

      scene.fog = new THREE.Fog(0xe9d8bd, 8, 18);

      camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );

      camera.position.set(0, 2.2, 6.5);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false
      });

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;

      document.getElementById("app").appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 1.5, 0);
      controls.minDistance = 3;
      controls.maxDistance = 10;
      controls.maxPolarAngle = Math.PI / 2.05;

      addLights();
      addFloor();
      loadPhoenix();

      window.addEventListener("resize", onWindowResize);

      startButton.addEventListener("click", startPhoenixSequence);
    }

    function addLights() {
      const hemiLight = new THREE.HemisphereLight(
        0xffead2,
        0x5c3828,
        2.4
      );

      scene.add(hemiLight);

      const keyLight = new THREE.DirectionalLight(0xfff0d0, 4);
      keyLight.position.set(-4, 7, 5);
      keyLight.castShadow = true;

      keyLight.shadow.mapSize.width = 2048;
      keyLight.shadow.mapSize.height = 2048;

      scene.add(keyLight);

      const warmLight = new THREE.PointLight(0xff6422, 0, 7, 2);
      warmLight.name = "FireLight";
      warmLight.position.set(0, 1.8, 1.2);

      scene.add(warmLight);
    }

    function addFloor() {
      const floorGeometry = new THREE.CircleGeometry(9, 96);

      const floorMaterial = new THREE.MeshStandardMaterial({
        color: 0xd9c19f,
        roughness: 0.95,
        metalness: 0
      });

      const floor = new THREE.Mesh(
        floorGeometry,
        floorMaterial
      );

      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -1.7;
      floor.receiveShadow = true;

      scene.add(floor);
    }

    function loadPhoenix() {
      const loader = new GLTFLoader();

      message.textContent = "Loading phoenix...";

      loader.load(
        "./models/phoenix.glb",

        function (gltf) {
          phoenix = gltf.scene;

          phoenix.traverse((object) => {
            if (object.isMesh) {
              object.castShadow = true;
              object.receiveShadow = true;

              if (object.material) {
                object.material.envMapIntensity = 1.4;
              }
            }
          });

          phoenix.scale.set(2.4, 2.4, 2.4);
          phoenix.position.set(0, -1.55, 0);

          scene.add(phoenix);

          message.textContent = "The phoenix is ready...";
          startButton.disabled = false;
        },

        function (progress) {
          if (progress.total) {
            const percent = Math.round(
              (progress.loaded / progress.total) * 100
            );

            message.textContent =
              `Loading phoenix... ${percent}%`;
          }
        },

        function (error) {
          console.error("Could not load phoenix.glb:", error);

          message.textContent =
            "ERROR: Phoenix could not be loaded.";

          startButton.disabled = true;
        }
      );
    }

    function startPhoenixSequence() {
      if (fireActive || !phoenix) return;

      fireActive = true;
      fireStartTime = performance.now();

      startButton.style.display = "none";

      message.textContent =
        "The Phoenix is breathing fire...";

      createFireParticles();
      createEmberParticles();
      createSmokeParticles();

      const fireLight =
        scene.getObjectByName("FireLight");

      if (fireLight) {
        fireLight.intensity = 7;
      }

      setTimeout(() => {
        fireActive = false;

        if (fireParticles) {
          scene.remove(fireParticles);
          fireParticles.geometry.dispose();
          fireParticles.material.dispose();
        }

        if (emberParticles) {
          scene.remove(emberParticles);
          emberParticles.geometry.dispose();
          emberParticles.material.dispose();
        }

        if (smokeParticles) {
          scene.remove(smokeParticles);
          smokeParticles.geometry.dispose();
          smokeParticles.material.dispose();
        }

        fireParticles = null;
        emberParticles = null;
        smokeParticles = null;

        if (fireLight) {
          fireLight.intensity = 0;
        }

        message.textContent = "Hello love";

        speakText("Hello love");

        startButton.style.display = "block";
        startButton.textContent = "Awaken Again";
      }, 10000);
    }

    function getMouthPosition() {
      return new THREE.Vector3(
        0,
        1.25,
        1.05
      );
    }

    function createFlameTexture() {
      const canvas = document.createElement("canvas");

      canvas.width = 128;
      canvas.height = 128;

      const context = canvas.getContext("2d");

      const gradient =
        context.createRadialGradient(
          64,
          64,
          3,
          64,
          64,
          64
        );

      gradient.addColorStop(
        0,
        "rgba(255,255,220,1)"
      );

      gradient.addColorStop(
        0.18,
        "rgba(255,220,70,1)"
      );

      gradient.addColorStop(
        0.48,
        "rgba(255,90,10,0.85)"
      );

      gradient.addColorStop(
        0.75,
        "rgba(180,20,0,0.3)"
      );

      gradient.addColorStop(
        1,
        "rgba(80,0,0,0)"
      );

      context.fillStyle = gradient;
      context.fillRect(0, 0, 128, 128);

      const texture =
        new THREE.CanvasTexture(canvas);

      texture.colorSpace =
        THREE.SRGBColorSpace;

      return texture;
    }

    function createFireParticles() {
      const count = 850;

      const geometry =
        new THREE.BufferGeometry();

      const positions =
        new Float32Array(count * 3);

      const velocities =
        new Float32Array(count * 3);

      const sizes =
        new Float32Array(count);

      for (let i = 0; i < count; i++) {
        resetFireParticle(
          i,
          positions,
          velocities,
          sizes
        );
      }

      geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
          positions,
          3
        )
      );

      geometry.setAttribute(
        "aVelocity",
        new THREE.BufferAttribute(
          velocities,
          3
        )
      );

      geometry.setAttribute(
        "aSize",
        new THREE.BufferAttribute(
          sizes,
          1
        )
      );

      const material =
        new THREE.ShaderMaterial({
          uniforms: {
            uTexture: {
              value: createFlameTexture()
            },

            uTime: {
              value: 0
            }
          },

          vertexShader: `
            attribute vec3 aVelocity;
            attribute float aSize;

            uniform float uTime;

            varying float vLife;

            void main() {
              vec3 p = position;

              float life =
                mod(
                  uTime * 0.9 +
                  position.x * 2.0,
                  1.0
                );

              p += aVelocity * life;

              p.x +=
                sin(
                  uTime * 5.0 +
                  position.y * 10.0
                ) * 0.12 * life;

              p.y +=
                sin(
                  uTime * 8.0 +
                  position.z * 7.0
                ) * 0.08 * life;

              vLife = 1.0 - life;

              vec4 mvPosition =
                modelViewMatrix *
                vec4(p, 1.0);

              gl_PointSize =
                aSize *
                (300.0 / -mvPosition.z);

              gl_Position =
                projectionMatrix *
                mvPosition;
            }
          `,

          fragmentShader: `
            uniform sampler2D uTexture;

            varying float vLife;

            void main() {
              vec4 color =
                texture2D(
                  uTexture,
                  gl_PointCoord
                );

              color.a *= vLife * 1.4;

              if (color.a < 0.02)
                discard;

              gl_FragColor = color;
            }
          `,

          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

      fireParticles =
        new THREE.Points(
          geometry,
          material
        );

      fireParticles.frustumCulled = false;

      scene.add(fireParticles);
    }

    function resetFireParticle(
      index,
      positions,
      velocities,
      sizes
    ) {
      const i3 = index * 3;

      const mouth =
        getMouthPosition();

      positions[i3] =
        mouth.x +
        (Math.random() - 0.5) * 0.18;

      positions[i3 + 1] =
        mouth.y +
        (Math.random() - 0.5) * 0.18;

      positions[i3 + 2] =
        mouth.z +
        (Math.random() - 0.5) * 0.18;

      velocities[i3] =
        (Math.random() - 0.5) * 0.5;

      velocities[i3 + 1] =
        (Math.random() - 0.5) * 0.4;

      velocities[i3 + 2] =
        0.8 + Math.random() * 2.5;

      sizes[index] =
        0.12 + Math.random() * 0.32;
    }

    function createEmberParticles() {
      const count = 220;

      const geometry =
        new THREE.BufferGeometry();

      const positions =
        new Float32Array(count * 3);

      const mouth =
        getMouthPosition();

      for (let i = 0; i < count; i++) {
        const i3 = i * 3;

        positions[i3] =
          mouth.x +
          (Math.random() - 0.5) * 0.7;

        positions[i3 + 1] =
          mouth.y +
          (Math.random() - 0.5) * 0.7;

        positions[i3 + 2] =
          mouth.z +
          Math.random() * 3.0;
      }

      geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
          positions,
          3
        )
      );

      const material =
        new THREE.PointsMaterial({
          color: 0xffc04a,
          size: 0.045,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });

      emberParticles =
        new THREE.Points(
          geometry,
          material
        );

      scene.add(emberParticles);
    }

    function createSmokeParticles() {
      const count = 80;

      const geometry =
        new THREE.BufferGeometry();

      const positions =
        new Float32Array(count * 3);

      const mouth =
        getMouthPosition();

      for (let i = 0; i < count; i++) {
        const i3 = i * 3;

        positions[i3] =
          mouth.x +
          (Math.random() - 0.5) * 0.6;

        positions[i3 + 1] =
          mouth.y +
          (Math.random() - 0.5) * 0.6;

        positions[i3 + 2] =
          mouth.z +
          Math.random() * 2.5;
      }

      geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
          positions,
          3
        )
      );

      const material =
        new THREE.PointsMaterial({
          color: 0x4d342b,
          size: 0.18,
          transparent: true,
          opacity: 0.12,
          depthWrite: false
        });

      smokeParticles =
        new THREE.Points(
          geometry,
          material
        );

      scene.add(smokeParticles);
    }

    function speakText(text) {
      if (!("speechSynthesis" in window)) {
        console.warn(
          "Text-to-speech is not supported."
        );

        return;
      }

      window.speechSynthesis.cancel();

      const speech =
        new SpeechSynthesisUtterance(text);

      speech.lang = "en-US";
      speech.rate = 0.82;
      speech.pitch = 0.9;
      speech.volume = 1;

      window.speechSynthesis.speak(speech);
    }

    function updateFire() {
      if (!fireActive || !fireParticles)
        return;

      const elapsed =
        (performance.now() -
          fireStartTime) /
        1000;

      fireParticles.material.uniforms.uTime.value =
        elapsed;

      const fireLight =
        scene.getObjectByName(
          "FireLight"
        );

      if (fireLight) {
        fireLight.intensity =
          5.5 +
          Math.sin(elapsed * 18) * 1.5 +
          Math.random() * 1.5;
      }

      if (emberParticles) {
        emberParticles.rotation.y +=
          0.004;

        emberParticles.position.y =
          Math.sin(elapsed * 2.5) *
          0.04;
      }

      if (smokeParticles) {
        smokeParticles.rotation.y -=
          0.002;

        smokeParticles.position.y =
          Math.sin(elapsed * 1.4) *
          0.08;
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      updateFire();

      if (phoenix) {
        phoenix.position.y =
          -1.55 +
          Math.sin(
            performance.now() *
            0.0015
          ) * 0.025;

        phoenix.rotation.y +=
          Math.sin(
            performance.now() *
            0.0005
          ) * 0.00003;
      }

      controls.update();

      renderer.render(
        scene,
        camera
      );
    }

    function onWindowResize() {
      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    }
  </script>
